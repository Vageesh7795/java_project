apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-demo
spec:
  replicas: 2

  selector:
    matchLabels:
      app: springboot-demo

  template:
    metadata:
      labels:
        app: springboot-demo

    spec:
      containers:
        - name: springboot-demo

          image: image-registry.openshift-image-registry.svc:5000/cicd-demo/springboot-demo:latest

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: 500m
              memory: 512Mi
